<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AXIOMATIQUE</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        background: #1e1e1e;
        overflow: hidden;
        font-family: 'Courier New', monospace;
      }
      #container {
        position: relative;
        width: 100%; height: 100%;
      }
      #c {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%; display: block;
      }
      #ui {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
      }

      /* ── HUD (top-left) ───────────────────────────────────────────── */
      #hud {
        position: absolute; top: 2.8vh; left: 1.6vw;
        color: #fff;
        font: clamp(9px, 1.1vmin, 16px)/1.8 'Courier New', monospace;
        letter-spacing: 0.18em;
        pointer-events: none;
      }
      #hud .corruption { color: #ff0033; }
      #hud .combo      { color: #aaaaaa; }
      #hoverBarWrap {
        position: absolute; top: 2.8vh; right: 1.6vw;
        width: 1.7vw; height: 36vh;
        background: #1a1a1a;
      }
      #hoverBar {
        width: 100%; height: 100%;
        background: #ffffff;
      }

      /* ── Centre status overlay ────────────────────────────────────── */
      #status {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font: bold clamp(14px, 1.8vmin, 28px)/2 'Courier New', monospace;
        letter-spacing: 0.22em;
        pointer-events: none;
        text-align: center;
        display: none;
        white-space: pre;
      }

      /* ── Controls hint (bottom-right) ────────────────────────────── */
      #controls {
        position: absolute; bottom: 2.8vh; right: 1.6vw;
        color: #333;
        font: clamp(8px, 0.9vmin, 14px)/1.8 'Courier New', monospace;
        letter-spacing: 0.1em;
        pointer-events: none;
        text-align: right;
      }

      /* ── Boot prompt ─────────────────────────────────────────────── */
      #boot {
        position: absolute; bottom: 2.8vh; left: 50%;
        transform: translateX(-50%);
        color: #ffffff;
        font-size: clamp(10px, 1vmin, 16px);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        opacity: 0.5;
        animation: blink 1.2s step-end infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="container">
      <canvas id="c"></canvas>
      <canvas id="ui"></canvas>

      <div id="hud">
        <div>SCORE &nbsp;&nbsp;: <span id="scoreVal">0</span></div>
        <div class="corruption">CORRUPT : <span id="corruptVal">0</span>%</div>
        <div class="combo">COMBO &nbsp;&nbsp;: <span id="comboVal">0</span></div>
        <div id="phaseLabel">PHASE I   // THE DESCENT</div>
      </div>

      <div id="hoverBarWrap"><div id="hoverBar"></div></div>

      <div id="status"></div>

      <div id="controls">
        [SPACE] HOLD TO FLOAT<br>
        [ENTER] SONAR PING
        [A] &amp; [D] LANE SWITCH
      </div>

      <div id="boot">PRESS ANY KEY TO INITIALISE</div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
